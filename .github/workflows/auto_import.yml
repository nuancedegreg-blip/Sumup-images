name: Master Leroy Merlin catalog for SumUp

on:
  push:
    branches: [main]
    paths:
      - 'auto_import.py'
      - '.github/workflows/auto_import.yml'
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: sumup-master-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAX_NEW: '500'
      AUDIT_EXISTING: '150'
      REQUEST_DELAY: '0.15'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Audit, enrich and build SumUp catalogs
        run: python auto_import.py

      - name: Commit catalog outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog_images Catalogue_Maitre_SumUp.csv SumUp_Nouveaux_Articles.csv SumUp_MAJ_Articles.csv catalogue_audit_report.csv catalogue_summary.json catalogue_state.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update SumUp master catalog, audit and images'
            git pull --rebase origin main
            git push
          fi
