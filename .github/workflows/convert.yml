name: Recover SumUp images V9 direct product pages

on:
  push:
    branches: [main]
    paths:
      - 'repair_direct_v9.py'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

concurrency:
  group: sumup-v9-direct
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V9_BATCH: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and ffmpeg
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Open exact Leroy product pages and capture product images
        run: python repair_direct_v9.py
      - name: Commit V9 test results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images_v9 Cat1_SumUp_FINAL.csv Catalogue_Maitre_SumUp.csv repair_v9_report.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'V9 test: direct Leroy product pages and image capture'
            git pull --rebase origin main
            git push
          fi
