name: Repair missing SumUp images

on:
  push:
    branches: [main]
    paths:
      - 'convert_sumup.py'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

concurrency:
  group: sumup-missing-image-repair
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_WORKERS: '24'
      IMAGE_TIMEOUT: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install requests
      - name: Repair only missing images by Leroy reference
        run: python convert_sumup.py
      - name: Commit repaired images and master catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images Cat1_SumUp_FINAL.csv Catalogue_Maitre_SumUp.csv conversion_report.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Repair missing SumUp images only'
            git pull --rebase origin main
            git push
          fi
