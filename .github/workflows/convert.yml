name: Repair SumUp images V5

on:
  push:
    branches: [main]
    paths:
      - 'repair_v5_jina.py'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

concurrency:
  group: sumup-repair-v5
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_WORKERS: '10'
      IMAGE_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install requests
      - name: Recover images through public reader and search proxy
        run: python repair_v5_jina.py
      - name: Commit V5 recovered images and catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images_v3 Cat1_SumUp_FINAL.csv Catalogue_Maitre_SumUp.csv repair_v5_report.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Repair SumUp images V5 through reader proxy'
            git pull --rebase origin main
            git push
          fi
