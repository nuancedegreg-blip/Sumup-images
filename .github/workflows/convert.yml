name: Apply verified Leroy images

on:
  push:
    branches: [main]
    paths:
      - 'verified_image_map.csv'
      - 'apply_verified_images.py'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified Leroy image URLs
        run: python apply_verified_images.py
      - name: Commit updated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cat1_SumUp_FINAL.csv Catalogue_Maitre_SumUp.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Apply verified Leroy ADEO image URLs to SumUp catalog'
            git pull --rebase origin main
            git push
          fi
