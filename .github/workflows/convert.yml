name: Recover SumUp images V10 strict index

on:
  push:
    branches: [main]
    paths:
      - 'repair_index_v10.py'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

concurrency:
  group: sumup-v10-strict-index
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V10_BATCH: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install requests
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Recover strictly matched indexed Leroy images
        run: python repair_index_v10.py
      - name: Commit V10 test results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images_v10 Cat1_SumUp_FINAL.csv Catalogue_Maitre_SumUp.csv repair_v10_report.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'V10 strict indexed Leroy image recovery test'
            git pull --rebase origin main
            git push
          fi
