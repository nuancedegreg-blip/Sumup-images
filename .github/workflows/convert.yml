name: Recover SumUp images V8 digits-only

on:
  push:
    branches: [main]
    paths:
      - 'repair_browser_v8_digits.py'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

concurrency:
  group: sumup-v8-digits-only
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V8_BATCH: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and ffmpeg
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Search Leroy with digits-only references
        run: python repair_browser_v8_digits.py
      - name: Commit V8 test results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images_v8 Cat1_SumUp_FINAL.csv Catalogue_Maitre_SumUp.csv repair_v8_report.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'V8 test: search Leroy using digits-only references'
            git pull --rebase origin main
            git push
          fi
