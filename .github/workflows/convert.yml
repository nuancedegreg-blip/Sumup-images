name: Rollback invalid V6 images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert.yml'
  workflow_dispatch:

concurrency:
  group: sumup-v6-rollback
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean pre-V6 catalogue
        run: |
          git checkout 6b7c066c964ac509d4b77fb3e2d88f25b239c6c7 -- Cat1_SumUp_FINAL.csv Catalogue_Maitre_SumUp.csv
          rm -rf images_v6 repair_v6_report.csv
          rm -f restore_note.tmp rollback_v6_marker.txt rollback_instruction.txt
      - name: Commit rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to rollback'
          else
            git commit -m 'Rollback invalid V6 product images and restore clean catalogue'
            git pull --rebase origin main
            git push
          fi
