name: Rebuild SumUp catalog V3

on:
  push:
    branches: [main]
    paths:
      - 'Cat1.csv'
      - 'convert_sumup.py'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

concurrency:
  group: sumup-rebuild-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_WORKERS: '20'
      IMAGE_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install requests
      - name: Rebuild clean catalog from Leroy sitemap
        run: python convert_sumup.py
      - name: Commit V3 images and rebuilt catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images_v3 Cat1_SumUp_FINAL.csv Catalogue_Maitre_SumUp.csv rebuild_report.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Rebuild clean SumUp catalog V3 with stable JPG images'
            git pull --rebase origin main
            git push
          fi
